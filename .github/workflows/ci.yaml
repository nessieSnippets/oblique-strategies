name: CI
on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
      - develop
      - release**
jobs: 
  install_and_test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
